<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04</title>
    <style>
        #avo {
            width: 200px;
            height: 200px;
        }

        #pai {
            width: 100px;
            height: 100px;
        }

        #filho {
            width: 50px;
            height: 50px;
        }
    </style>
</head>

<body>
    <div id="avo">
        <div id="pai">
            <div id="filho">
            </div>
        </div>
    </div>
    <script>
        let filho = document.querySelector('#filho')
        filho.parentNode.parentNode.style.backgroundColor = 'green'
        console.log(filho)
    </script>
</body>

</html>
